name: "Inkbird ISC-027BW Bridge"
description: "MQTT bridge for Inkbird ISC-027BW 2.0 BBQ fan controller with full local control"
version: "1.3.0"
slug: "inkbird-bridge"
init: false
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
options:
  tuya_device_id: ""
  tuya_ip: ""
  tuya_key: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
  poll_interval: 30
schema:
  tuya_device_id: str
  tuya_ip: str
  tuya_key: str
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_pass: str
  poll_interval: int
host_network: true
